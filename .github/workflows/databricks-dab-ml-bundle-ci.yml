# This GitHub workflow validates Bundle config (ML resource config and more)
# defined under databricks_dab_ml/resources/*
# and databricks_dab_ml/databricks.yml, when PRs are merged into the main branch
name: Bundle validation for databricks-dab-ml

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'databricks_dab_ml/**'

defaults:
  run:
    working-directory: ./databricks_dab_ml/

env:
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
  

jobs:
  prod:
    concurrency: databricks-dab-ml-prod-bundle-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Prod
        id: validate
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          
        run: |
          databricks bundle validate -t prod > ../validate_output.txt
      - name: Create Comment with Bundle Configuration
        uses: actions/github-script@v7
        id: comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const fileContents = fs.readFileSync('validate_output.txt', 'utf8');
            const output = `#### Bundle Prod Config Validated 🖌
            <details><summary>Prod Validation Output</summary>

            \`\`\`\n
            ${fileContents}
            \`\`\`

            </details>`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
